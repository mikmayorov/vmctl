[host]
libvirt_uri = "qemu:///system"
# Optional when libvirt stores persistent domain XML outside /etc/libvirt/qemu.
# domain_xml_directory = "/etc/libvirt/qemu"

[storage]
# Replace with the disk directory on this host. New VM requests copy it to NetBox.
directory = "/var/lib/libvirt/images"

[network]
# Default for a new request; each VM's selected bridge is stored in NetBox.
bridge = "br0" # Replace with a bridge that exists on this host.

[hardware.small]
vcpus = 2
memory_mb = 2048
disk_gb = 20

[hardware.medium]
vcpus = 4
memory_mb = 4096
disk_gb = 40

[hardware.large]
vcpus = 8
memory_mb = 8192
disk_gb = 80

[netbox]
url = "https://netbox.example.org" # Replace when NetBox mode is enabled.
key = "" # Optional: leave empty when using netbox.key file or NETBOX_TOKEN.
device = "hypervisor-01" # Name of a device already created in NetBox.
site = "" # Site slug; set when the device name exists at several sites.
tenant = "" # Tenant slug; set only if name and site are still ambiguous.
